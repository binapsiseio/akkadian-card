<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面｜アッカド語学習カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./style.css">
</head>

<body>
<main class="page">

<header class="header">
  <div class="english">admin page</div>
  <div class="title"><span class="an-sign">𒀭</span><span>管理画面</span></div>
  <div class="divider">◆</div>
</header>

<section class="panel">
  <h2>ログイン</h2>
  <input type="email" id="email" placeholder="メールアドレス">
  <input type="password" id="password" placeholder="パスワード">
  <div class="admin-grid">
    <button type="button" onclick="login()">ログイン</button>
    <button type="button" class="danger" onclick="logout()">ログアウト</button>
  </div>
  <div class="admin-status" id="loginStatus">ログインしてください。</div>
</section>

<div id="adminArea" class="hidden">

<section class="panel">
  <h2>レベル管理</h2>

  <input type="text" id="newLevelName" placeholder="新しいレベル名">
  <input type="number" id="newLevelOrder" placeholder="並び順 例: 10">
  <button type="button" onclick="addLevel()">レベル追加</button>

  <div class="admin-status" id="levelStatus"></div>
  <div class="level-admin-list" id="levelList"></div>
</section>

<section class="panel" id="editPanel">
  <h2>単語登録・編集</h2>

  <input type="hidden" id="editId">
  <input type="text" id="front" placeholder="表：音写">
  <input type="text" id="back" placeholder="裏：意味">
  <textarea id="note" placeholder="例文・メモ"></textarea>
  <select id="level"></select>

  <div class="admin-grid">
    <button type="button" onclick="saveCard()">保存</button>
    <button type="button" onclick="clearForm()">クリア</button>
  </div>
</section>

<section class="panel">
  <h2>CSV管理</h2>

  <div class="admin-grid">
    <button type="button" onclick="downloadCSV()">CSVダウンロード</button>
    <button type="button" onclick="uploadCSV()">CSV一括アップロード</button>
  </div>

  <input type="file" id="csvFile" accept=".csv,text/csv">
  <p class="csv-note">CSV形式：front,back,note,level</p>
</section>

<section class="panel">
  <h2>登録単語一覧</h2>
  <div class="admin-status" id="adminStatus"></div>
  <div class="list" id="list"></div>
</section>

</div>

<div class="admin-small">
  <a href="./index.html">学習画面へ戻る</a>
</div>

</main>

<script>
const supabaseClient = supabase.createClient(
  "https://dkfltvfoxmhinnfodcvc.supabase.co",
  "sb_publishable_W_e4VNpoaM1mdtmmNi6f8w_ijLC-Yw5"
);

let cards = [];
let levels = [];
let currentSession = null;

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showAdmin(show){
  document.getElementById("adminArea").classList.toggle("hidden", !show);
}

function setText(id, text){
  const el = document.getElementById(id);
  if(el) el.textContent = text || "";
}

function clearAdminScreen(){
  cards = [];
  levels = [];
  document.getElementById("list").innerHTML = "";
  document.getElementById("levelList").innerHTML = "";
  document.getElementById("level").innerHTML = "";
  document.getElementById("adminStatus").textContent = "";
  document.getElementById("levelStatus").textContent = "";
  document.getElementById("newLevelName").value = "";
  document.getElementById("newLevelOrder").value = "";
  document.getElementById("csvFile").value = "";
  clearForm();
}

async function getSession(){
  const result = await supabaseClient.auth.getSession();
  currentSession = result.data.session || null;
  return currentSession;
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    alert("メールアドレスとパスワードを入力してください");
    return;
  }

  setText("loginStatus", "ログイン中...");

  const result = await supabaseClient.auth.signInWithPassword({ email, password });

  if(result.error){
    currentSession = null;
    showAdmin(false);
    setText("loginStatus", "ログイン失敗");
    alert("ログインできません: " + result.error.message);
    return;
  }

  currentSession = result.data.session;
  localStorage.setItem("excludeAnalytics", "true");

  showAdmin(true);
  setText("loginStatus", "ログイン中: " + currentSession.user.email + "（この端末はAnalytics除外）");

  await loadAll();
}

async function logout(){
  await supabaseClient.auth.signOut();

  currentSession = null;
  clearAdminScreen();
  showAdmin(false);
  setText("loginStatus", "ログアウトしました。");
}

async function ensureLogin(){
  const session = await getSession();

  if(!session){
    showAdmin(false);
    setText("loginStatus", "ログインしてください。");
    return false;
  }

  localStorage.setItem("excludeAnalytics", "true");

  showAdmin(true);
  setText("loginStatus", "ログイン中: " + session.user.email + "（この端末はAnalytics除外）");
  return true;
}

async function loadAll(){
  const ok = await ensureLogin();
  if(!ok) return;

  await loadLevels();
  await loadCards();
}

async function loadLevels(){
  const ok = await ensureLogin();
  if(!ok) return;

  setText("levelStatus", "レベル読み込み中...");

  const result = await supabaseClient
    .from("levels")
    .select("id,name,sort_order,created_at")
    .order("sort_order", { ascending:true })
    .order("name", { ascending:true });

  if(result.error){
    setText("levelStatus", "レベル読み込みエラー: " + result.error.message);
    return;
  }

  levels = result.data || [];
  renderLevelOptions();
  renderLevelList();
  setText("levelStatus", levels.length + "件のレベルを読み込みました。");
}

function renderLevelOptions(){
  const select = document.getElementById("level");

  if(levels.length === 0){
    select.innerHTML = '<option value="">レベル未設定</option>';
    return;
  }

  select.innerHTML = levels.map(level =>
    '<option value="' + escapeHtml(level.name) + '">' + escapeHtml(level.name) + '</option>'
  ).join("");
}

function renderLevelList(){
  const area = document.getElementById("levelList");

  if(levels.length === 0){
    area.innerHTML = '<div class="empty-message">レベル未登録</div>';
    return;
  }

  area.innerHTML = levels.map((level, index) => `
    <div class="level-admin-item">
      <div style="width:100%;">
        <input type="text" id="levelName_${index}" value="${escapeHtml(level.name)}" placeholder="レベル名">
        <input type="number" id="levelOrder_${index}" value="${escapeHtml(level.sort_order)}" placeholder="並び順">
        <div class="inline-actions">
          <button type="button" onclick="updateLevel(${index})">更新</button>
          <button type="button" class="danger" onclick="deleteLevel(${index})">削除</button>
        </div>
      </div>
    </div>
  `).join("");
}

async function addLevel(){
  const ok = await ensureLogin();
  if(!ok) return;

  const name = document.getElementById("newLevelName").value.trim();
  const sortOrderInput = document.getElementById("newLevelOrder").value;
  const sort_order = sortOrderInput ? Number(sortOrderInput) : 100;

  if(!name){
    alert("レベル名を入力してください");
    return;
  }

  const result = await supabaseClient
    .from("levels")
    .insert({ name, sort_order })
    .select();

  if(result.error){
    alert("レベル追加エラー: " + result.error.message);
    return;
  }

  document.getElementById("newLevelName").value = "";
  document.getElementById("newLevelOrder").value = "";

  await loadLevels();
  alert("レベルを追加しました");
}

async function updateLevel(index){
  const ok = await ensureLogin();
  if(!ok) return;

  const level = levels[index];
  if(!level) return;

  const newName = document.getElementById("levelName_" + index).value.trim();
  const sort_order = Number(document.getElementById("levelOrder_" + index).value || 100);

  if(!newName){
    alert("レベル名を入力してください");
    return;
  }

  const oldName = level.name;

  const result = await supabaseClient
    .from("levels")
    .update({ name:newName, sort_order })
    .eq("id", level.id)
    .select();

  if(result.error){
    alert("レベル更新エラー: " + result.error.message);
    return;
  }

  if(oldName !== newName){
    const cardUpdate = await supabaseClient
      .from("cards")
      .update({ level:newName })
      .eq("level", oldName);

    if(cardUpdate.error){
      alert("レベル名は更新しましたが、単語側の更新に失敗しました: " + cardUpdate.error.message);
    }
  }

  await loadAll();
  alert("レベルを更新しました");
}

async function deleteLevel(index){
  const ok = await ensureLogin();
  if(!ok) return;

  const level = levels[index];
  if(!level) return;

  const used = cards.filter(card => card.level === level.name).length;

  if(used > 0){
    alert("このレベルは " + used + " 件の単語で使われています。先に単語側のレベルを変更してください。");
    return;
  }

  if(!confirm("レベル「" + level.name + "」を削除しますか？")) return;

  const result = await supabaseClient
    .from("levels")
    .delete()
    .eq("id", level.id);

  if(result.error){
    alert("レベル削除エラー: " + result.error.message);
    return;
  }

  await loadLevels();
  alert("レベルを削除しました");
}

async function loadCards(){
  const ok = await ensureLogin();
  if(!ok) return;

  setText("adminStatus", "単語読み込み中...");

  const result = await supabaseClient
    .from("cards")
    .select("id,front,back,note,level,created_at")
    .order("front", { ascending:true });

  if(result.error){
    setText("adminStatus", "単語読み込みエラー: " + result.error.message);
    document.getElementById("list").innerHTML = "";
    return;
  }

  cards = result.data || [];
  renderList();
  setText("adminStatus", cards.length + "件の単語を読み込みました。");
}

function renderList(){
  const area = document.getElementById("list");

  if(cards.length === 0){
    area.innerHTML = '<div class="empty-message">登録単語なし</div>';
    return;
  }

  area.innerHTML = cards.map((card, index) => `
    <div class="item">
      <strong>${escapeHtml(card.front)}</strong> / ${escapeHtml(card.back)}
      <br><small>レベル: ${escapeHtml(card.level || "未設定")}</small>
      ${card.note ? '<br><small>' + escapeHtml(card.note) + '</small>' : ''}
      <div class="inline-actions">
        <button type="button" onclick="editCard(${index})">編集</button>
        <button type="button" class="danger" onclick="deleteCard('${card.id}')">削除</button>
      </div>
    </div>
  `).join("");
}

function editCard(index){
  const card = cards[index];
  if(!card) return;

  document.getElementById("editId").value = card.id;
  document.getElementById("front").value = card.front || "";
  document.getElementById("back").value = card.back || "";
  document.getElementById("note").value = card.note || "";

  if(card.level && levels.some(level => level.name === card.level)){
    document.getElementById("level").value = card.level;
  }else if(levels[0]){
    document.getElementById("level").value = levels[0].name;
  }

  document.getElementById("editPanel").scrollIntoView({behavior:"smooth", block:"start"});
}

function clearForm(){
  const editId = document.getElementById("editId");
  if(!editId) return;

  document.getElementById("editId").value = "";
  document.getElementById("front").value = "";
  document.getElementById("back").value = "";
  document.getElementById("note").value = "";

  if(levels[0]){
    document.getElementById("level").value = levels[0].name;
  }
}

async function saveCard(){
  const ok = await ensureLogin();
  if(!ok) return;

  const id = document.getElementById("editId").value;
  const front = document.getElementById("front").value.trim();
  const back = document.getElementById("back").value.trim();
  const note = document.getElementById("note").value.trim();
  const level = document.getElementById("level").value;

  if(!front || !back){
    alert("表と裏は必須です");
    return;
  }

  let result;

  if(id){
    result = await supabaseClient
      .from("cards")
      .update({ front, back, note, level })
      .eq("id", id)
      .select();
  }else{
    result = await supabaseClient
      .from("cards")
      .insert({ front, back, note, level })
      .select();
  }

  if(result.error){
    alert("保存エラー: " + result.error.message);
    return;
  }

  clearForm();
  await loadCards();
  alert(id ? "更新しました" : "登録しました");
}

async function deleteCard(id){
  const ok = await ensureLogin();
  if(!ok) return;

  if(!confirm("削除しますか？")) return;

  const result = await supabaseClient
    .from("cards")
    .delete()
    .eq("id", id);

  if(result.error){
    alert("削除エラー: " + result.error.message);
    return;
  }

  await loadCards();
  alert("削除しました");
}

function csvEscape(value){
  return '"' + String(value || "").replaceAll('"','""') + '"';
}

function downloadCSV(){
  if(!currentSession){
    alert("ログインが必要です");
    return;
  }

  let csv = "\uFEFFfront,back,note,level\n";

  cards.forEach(card => {
    csv += [
      csvEscape(card.front),
      csvEscape(card.back),
      csvEscape(card.note),
      csvEscape(card.level || "")
    ].join(",") + "\n";
  });

  const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "akkad_cards.csv";
  a.click();

  URL.revokeObjectURL(url);
}

async function readTextWithEncoding(file){
  const buffer = await file.arrayBuffer();

  try{
    return new TextDecoder("utf-8", { fatal:true }).decode(buffer);
  }catch(e){
    try{
      return new TextDecoder("shift_jis").decode(buffer);
    }catch(e2){
      return new TextDecoder("utf-8").decode(buffer);
    }
  }
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");

  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for(let i=0; i<text.length; i++){
    const char = text[i];
    const next = text[i+1];

    if(char === '"' && inQuotes && next === '"'){
      cell += '"';
      i++;
    }else if(char === '"'){
      inQuotes = !inQuotes;
    }else if(char === "," && !inQuotes){
      row.push(cell);
      cell = "";
    }else if((char === "\n" || char === "\r") && !inQuotes){
      if(char === "\r" && next === "\n") i++;

      row.push(cell);

      if(row.some(value => String(value).trim() !== "")){
        rows.push(row);
      }

      row = [];
      cell = "";
    }else{
      cell += char;
    }
  }

  row.push(cell);

  if(row.some(value => String(value).trim() !== "")){
    rows.push(row);
  }

  return rows;
}

async function uploadCSV(){
  const ok = await ensureLogin();
  if(!ok) return;

  const file = document.getElementById("csvFile").files[0];

  if(!file){
    alert("CSVを選択してください");
    return;
  }

  const text = await readTextWithEncoding(file);
  const rows = parseCSV(text);

  if(rows.length < 2){
    alert("CSVに登録できるデータがありません");
    return;
  }

  const header = rows[0].map(value => String(value).trim().toLowerCase());

  const frontIndex = header.indexOf("front");
  const backIndex = header.indexOf("back");
  const noteIndex = header.indexOf("note");
  const levelIndex = header.indexOf("level");

  if(frontIndex === -1 || backIndex === -1){
    alert("CSVの1行目に front,back,note,level を入れてください");
    return;
  }

  const insertRows = rows.slice(1).map(row => ({
    front: String(row[frontIndex] || "").trim(),
    back: String(row[backIndex] || "").trim(),
    note: noteIndex >= 0 ? String(row[noteIndex] || "").trim() : "",
    level: levelIndex >= 0 ? String(row[levelIndex] || "").trim() : ""
  })).filter(row => row.front && row.back);

  if(insertRows.length === 0){
    alert("登録できる行がありません");
    return;
  }

  const result = await supabaseClient
    .from("cards")
    .insert(insertRows)
    .select();

  if(result.error){
    alert("CSVアップロードエラー: " + result.error.message);
    return;
  }

  document.getElementById("csvFile").value = "";
  await loadCards();

  alert(insertRows.length + "件アップロードしました");
}

(async function init(){
  const session = await getSession();

  if(session){
    localStorage.setItem("excludeAnalytics", "true");

    showAdmin(true);
    setText("loginStatus", "ログイン中: " + session.user.email + "（この端末はAnalytics除外）");
    await loadAll();
  }else{
    showAdmin(false);
    setText("loginStatus", "ログインしてください。");
  }
})();
</script>

</body>
</html>
