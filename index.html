<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アッカド語学習カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./style.css">
</head>

<body>
<main class="page">

<header class="header">
  <div class="english">akkadian vocabulary</div>
  <div class="title">
    <span class="an-sign">𒀭</span>
    <span>アッカド語学習カード</span>
  </div>
  <div class="divider">◆</div>
</header>

<section>
  <div class="main-meta">
    <div id="counter">- / -</div>
    <button class="text-button" onclick="nextRandom()">⇄ シャッフル</button>
  </div>

  <div class="card" id="card">
    <div class="card-inner">
      <div class="front">読み込み中...</div>
    </div>
  </div>

  <div class="action-row">
<button class="again" onclick="previousCard()">× もう一度</button>
<button class="remember" onclick="nextRandom()">✓ 覚えた</button>
  </div>
</section>

<footer class="footer">
  作成者: ビナプシ　X　
  <a href="https://x.com/binapsi_meso" target="_blank">https://x.com/binapsi_meso</a><br>
  参考文献:<br>
  『アッカド語文法』青島忠一朗著（ヨベル社 2026）<br>
  <a href="https://yobel.co.jp/info/book20260311/" target="_blank">https://yobel.co.jp/info/book20260311/</a>

  <div class="admin-small">
    <a href="./admin.html">管理者ログイン</a>
  </div>
</footer>

</main>

<script>
const supabaseClient = supabase.createClient(
  "https://dkfltvfoxmhinnfodcvc.supabase.co",
  "sb_publishable_W_e4VNpoaM1mdtmmNi6f8w_ijLC-Yw5"
);

let cards = [];
let current = 0;
let showingFront = true;
let shownIndexes = [];
let historyIndexes = [];

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadCards(){
  const { data, error } = await supabaseClient
    .from("cards")
    .select("*");

  if(error){
    document.getElementById("card").innerHTML =
      '<div class="card-inner"><div class="front">読み込みエラー</div></div>';
    return;
  }

  cards = data || [];
  shownIndexes = [];

  if(cards.length > 0){
    nextRandom();
  }else{
    render();
  }
}

function pickRandomIndex(){
  if(cards.length <= 1) return 0;

  if(shownIndexes.length >= cards.length){
    shownIndexes = [];
  }

  let index;
  do{
    index = Math.floor(Math.random() * cards.length);
  }while(shownIndexes.includes(index) && shownIndexes.length < cards.length);

  shownIndexes.push(index);
  return index;
}

function render(){
  const card = document.getElementById("card");
  const counter = document.getElementById("counter");

  if(cards.length === 0){
    counter.textContent = "0 / 0";
    card.innerHTML = '<div class="card-inner"><div class="front">カードがありません</div></div>';
    return;
  }

  counter.textContent = (shownIndexes.length || 1) + " / " + cards.length;
  const c = cards[current];

  if(showingFront){
    card.innerHTML = `
      <div class="card-inner">
        <div class="side-label">音写</div>
        <div class="front">${escapeHtml(c.front)}</div>
      </div>
    `;
  }else{
    card.innerHTML = `
      <div class="card-inner">
        <div class="side-label">意味</div>
        <div class="back">${escapeHtml(c.back)}</div>
        ${c.note ? '<div class="note-line"></div><div class="note">' + escapeHtml(c.note) + '</div>' : ''}
      </div>
    `;
  }
}

document.getElementById("card").addEventListener("click",()=>{
  if(cards.length === 0) return;
  showingFront = !showingFront;
  render();
});

function nextRandom(){
  if(cards.length === 0) return;

  if(typeof current === "number"){
    historyIndexes.push(current);
  }

  current = pickRandomIndex();
  showingFront = true;
  render();
}

function previousCard(){
  if(cards.length === 0) return;

  if(historyIndexes.length > 0){
    current = historyIndexes.pop();
  }

  showingFront = true;
  render();
}

loadCards();
</script>
</body>
</html>
