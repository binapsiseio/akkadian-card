<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アッカド語学習カード</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-BSCQ8PV91S"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-BSCQ8PV91S');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./style.css">
</head>

<body>
<main class="page">

<header class="header">
  <div class="english">akkadian vocabulary</div>
  <div class="title"><span class="an-sign">𒀭</span><span>アッカド語学習カード</span></div>
  <div class="divider">◆</div>
</header>

<div class="filter-row">
  <label for="levelFilter">表示レベル</label>
  <select id="levelFilter" class="level-select" onchange="applyLevelFilter()">
    <option value="all">すべて</option>
  </select>
</div>

<div class="mode-box">
  <div class="mode-tabs" role="tablist">
    <button class="mode-tab active" id="studyTabButton" onclick="showTab('study')" type="button">学習</button>
    <button class="mode-tab" id="learnedTabButton" onclick="showTab('learned')" type="button">学習済み</button>
  </div>

  <section id="studyTab" class="mode-content">
    <div class="main-meta">
      <div id="counter">- / -</div>
      <button class="text-button" onclick="shuffleDeck()" type="button">⇄ シャッフル</button>
    </div>

    <div class="card" id="card">
      <div class="card-inner"><div class="front">読み込み中...</div></div>
    </div>

    <div class="action-row">
      <button class="again" onclick="previousCard()" type="button">× もう一度</button>
      <button class="remember" onclick="rememberAndNext()" type="button">✓ 覚えた</button>
    </div>

  <div class="reverse-row">
  <a href="javascript:void(0)" class="reverse-link" id="reverseButton" onclick="toggleReverseMode()">
    ▶日本語から出題
  </a>
</div>
  
  </section>

  <section id="learnedTab" class="mode-content hidden">
    <div class="learned-list" id="learnedList"></div>
    <div class="learned-footer">
      <button class="danger subtle-button" onclick="clearLearned()" type="button">履歴を削除</button>
    </div>
  </section>
</div>

<footer class="footer">
  参考文献:<a href="https://yobel.co.jp/info/book20260311/" target="_blank">青島忠一郎『アッカド語文法』ヨベル社 2026年</a><br>
  作成者:<a href="https://x.com/binapsi_meso" target="_blank">ビナプシ</a><br>
  掲載内容に誤りなどございましたら、Xよりご連絡いただけますと幸いです。<br>
</footer>

</main>

<script>
const supabaseClient=supabase.createClient(
  "https://dkfltvfoxmhinnfodcvc.supabase.co",
  "sb_publishable_W_e4VNpoaM1mdtmmNi6f8w_ijLC-Yw5"
);

let allCards=[];
let cards=[];
let levels=[];
let deck=[];
let position=0;
let showingFront=true;
let reverseMode=false;
const LEARNED_KEY="akkad_learned_cards_v1";

function escapeHtml(text){
  return String(text||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadLevels(){
  const {data,error}=await supabaseClient
    .from("levels")
    .select("*")
    .order("sort_order",{ascending:true});

  if(error){
    levels=[];
    return;
  }

  levels=data||[];
  const select=document.getElementById("levelFilter");
  select.innerHTML='<option value="all">すべて</option>'+
    levels.map(level=>`<option value="${escapeHtml(level.name)}">${escapeHtml(level.name)}</option>`).join("");
}

async function loadCards(){
  await loadLevels();

  const {data,error}=await supabaseClient
    .from("cards")
    .select("*");

  if(error){
    document.getElementById("card").innerHTML='<div class="card-inner"><div class="front">読み込みエラー</div></div>';
    return;
  }

  allCards=data||[];
  applyLevelFilter();
}

function applyLevelFilter(){
  const level=document.getElementById("levelFilter").value;
  cards=level==="all" ? allCards.slice() : allCards.filter(card=>(card.level||"")===level);
  shuffleDeck();
}

function makeShuffledDeck(){
  deck=cards.map((_,index)=>index);

  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }

  position=0;
}

function getCurrentCard(){
  if(cards.length===0||deck.length===0)return null;
  return cards[deck[position]];
}

function getDisplayData(card){
  if(!reverseMode){
    return {
      frontLabel:"音写",
      frontText:card.front,
      backLabel:"意味",
      backText:card.back,
      note:card.note||""
    };
  }

  return {
    frontLabel:"意味",
    frontText:card.back,
    backLabel:"音写",
    backText:card.front,
    note:card.note||""
  };
}

function render(){
  const card=document.getElementById("card");
  const counter=document.getElementById("counter");
  const c=getCurrentCard();

  if(!c){
    counter.textContent="0 / 0";
    card.innerHTML='<div class="card-inner"><div class="front">カードがありません</div></div>';
    return;
  }

  counter.textContent=(position+1)+" / "+cards.length;
  const display=getDisplayData(c);

  if(showingFront){
    card.innerHTML=`
      <div class="card-inner">
        <div class="side-label">${escapeHtml(display.frontLabel)}</div>
        <div class="card-content"><div class="front">${escapeHtml(display.frontText)}</div></div>
      </div>
    `;
  }else{
    card.innerHTML=`
      <div class="card-inner">
        <div class="side-label">${escapeHtml(display.backLabel)}</div>
        <div class="card-content">
          <div class="back">${escapeHtml(display.backText)}</div>
          ${display.note ? '<div class="note-line"></div><div class="note">'+escapeHtml(display.note)+'</div>' : ''}
        </div>
      </div>
    `;
  }
}

document.getElementById("card").addEventListener("click",()=>{
  if(cards.length===0)return;
  showingFront=!showingFront;
  render();
});

function nextCard(){
  if(cards.length===0)return;

  position++;

  if(position>=deck.length){
    makeShuffledDeck();
  }

  showingFront=true;
  render();
}

function previousCard(){
  if(cards.length===0)return;

  if(position>0){
    position--;
  }

  showingFront=true;
  render();
}

function shuffleDeck(){
  if(cards.length===0){
    deck=[];
    position=0;
    render();
    return;
  }

  makeShuffledDeck();
  showingFront=true;
  render();
}

function toggleReverseMode(){
  reverseMode=!reverseMode;
  showingFront=true;

  const button=document.getElementById("reverseButton");
  button.textContent=reverseMode ? "▶アッカド語から出題" : "▶日本語から出題";

  render();
}

function getLearned(){
  try{
    return JSON.parse(localStorage.getItem(LEARNED_KEY))||[];
  }catch(e){
    return [];
  }
}

function saveLearned(list){
  localStorage.setItem(LEARNED_KEY,JSON.stringify(list));
}

function rememberCurrentCard(){
  const c=getCurrentCard();
  if(!c)return;

  const list=getLearned();
  const exists=list.some(item=>item.id===c.id);

  if(!exists){
    list.unshift({
      id:c.id,
      front:c.front,
      back:c.back,
      learnedAt:new Date().toISOString()
    });

    saveLearned(list);
  }
}

function rememberAndNext(){
  rememberCurrentCard();
  nextCard();
}

function renderLearnedList(){
  const area=document.getElementById("learnedList");
  const list=getLearned();

  if(list.length===0){
    area.innerHTML='<div class="empty-message">まだ学習済みの単語はありません。</div>';
    return;
  }

  area.innerHTML=list.map(item=>`
    <div class="learned-item">
      <span class="learned-front">${escapeHtml(item.front)}</span>
      <span class="learned-back">${escapeHtml(item.back)}</span>
    </div>
  `).join("");
}

function clearLearned(){
  if(!confirm("学習済み履歴をすべて削除しますか？"))return;
  localStorage.removeItem(LEARNED_KEY);
  renderLearnedList();
}

function showTab(name){
  const isStudy=name==="study";

  document.getElementById("studyTab").classList.toggle("hidden",!isStudy);
  document.getElementById("learnedTab").classList.toggle("hidden",isStudy);

  document.getElementById("studyTabButton").classList.toggle("active",isStudy);
  document.getElementById("learnedTabButton").classList.toggle("active",!isStudy);

  if(!isStudy){
    renderLearnedList();
  }
}

loadCards();
</script>
</body>
</html>
